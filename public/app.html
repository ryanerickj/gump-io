<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gump.io</title><link rel="stylesheet" href="app.css"></head><body><main><header><span>GUMP.IO</span><h1>Frames locais do Frame.io</h1><p>Abra um proxy baixado — vídeo, frames e transcrição permanecem neste navegador.</p></header><section id="drop-zone" class="card drop-zone"><label class="file"><input id="file" type="file" accept="video/*" hidden>Escolher vídeo</label><span id="meta">Nenhum vídeo selecionado</span><span class="drop-hint">ou arraste e solte o MP4 nesta área</span><video id="video" preload="auto" muted playsinline></video><p id="status">Baixe no Frame.io o MP4 H.264 1920×1080 e abra-o aqui.</p><div id="progress"><i></i></div><div id="controls" hidden><div class="control-row"><label>Início <input id="start" type="text" value="00:00" inputmode="numeric" placeholder="00:00"></label><label>Fim <input id="end" type="text" inputmode="numeric" placeholder="fim do vídeo"></label><label>Intervalo <input id="interval" type="number" min="1" max="3600" value="15"> s</label><label>Máx. frames <input id="maxframes" type="number" min="1" max="1200" value="600"></label></div><div class="preset-row"><span>Atalhos:</span><button class="secondary small" data-interval="5">5 s</button><button class="secondary small" data-interval="10">10 s</button><button class="secondary small" data-interval="15">15 s</button><button class="secondary small" data-interval="30">30 s</button><button class="secondary small" data-interval="60">60 s</button><output id="scaninfo"></output></div><div class="action-row"><button id="scan">Varrer intervalo</button><button id="cancel" class="secondary">Cancelar</button></div></div><div id="specific" hidden><input id="timestamps" placeholder="Timestamps: 00:12, 05:43, 01:21:08"><button id="capture" class="secondary">Capturar timestamps</button></div></section><section id="results" hidden><div class="result-head"><strong id="count"></strong><div class="result-actions"><label class="order-label">Ordem <select id="order"><option value="reverse-time">Fim → início (de baixo para cima)</option><option value="time">Início → fim</option><option value="sharpness">Maior nitidez</option></select></label><button id="group" class="secondary">Agrupar frames</button><button id="export">Baixar PNGs selecionados</button></div></div><p id="group-status" class="small-note"></p><div id="grid"></div></section><dialog id="preview-modal"><img id="preview-image" alt="Preview ampliado do frame"><button id="preview-previous" class="preview-nav previous" aria-label="Frame anterior">‹</button><button id="preview-next" class="preview-nav next" aria-label="Próximo frame">›</button><button id="close-preview" class="close-preview" aria-label="Fechar preview">×</button><div class="preview-info"><div id="preview-caption"></div><div class="preview-actions"><button id="preview-download">⇩ Baixar PNG em alta</button><button id="preview-copy" class="secondary">⧉ Copiar em alta</button></div></div></dialog></main><script src="app.js"></script></body></html>
